<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Historias | BLOOM.INFIVE</title>
  <meta name="description" content="Lee historias de BLOOM.INFIVE sobre fe, maternidad, familia y ánimo por Angelika Burgos." />
  <link rel="canonical" href="https://bloominfive.blog/blog/index.html" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BLOOM.INFIVE" />
  <meta property="og:title" content="Historias | BLOOM.INFIVE" />
  <meta property="og:description" content="Historias cortas, reflexiones y novedades de BLOOM.INFIVE." />
  <meta property="og:url" content="https://bloominfive.blog/blog/index.html" />
  <meta property="og:image" content="https://bloominfive.blog/angelika.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Historias | BLOOM.INFIVE" />
  <meta name="twitter:description" content="Historias con fe por Angelika Burgos." />
  <meta name="twitter:image" content="https://bloominfive.blog/angelika.png" />
  <link rel="stylesheet" href="../styles.css" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "Historias BLOOM.INFIVE",
      "url": "https://bloominfive.blog/blog/index.html",
      "publisher": {
        "@type": "Person",
        "name": "Angelika Burgos"
      },
      "inLanguage": "en"
    }
  </script>
</head>

<body>
  <div id="navMount"></div>

  <main class="page-shell">
    <section class="page-hero">
      <div class="container page-hero-inner">
        <div>
          <p class="section-kicker">Diario Bloom.inFive</p>
          <h1 class="page-title">Historias para pausas tranquilas del día.</h1>
          <p class="page-subtitle">Notas, reflexiones y novedades de maternidad con fe, escritas para leer fácilmente en días llenos.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="posts" class="blogGrid" style="display:grid; grid-template-columns:1fr; gap:14px;">
          <article class="postCard">
            <div class="post-index">01</div>
            <div class="post-body">
              <h2>Cargando historias...</h2>
              <p class="muted">Dale un momentito en la primera carga.</p>
            </div>
          </article>

          <article class="postCard" style="opacity:.76;">
            <div class="post-index">02</div>
            <div class="post-body">
              <h2>&nbsp;</h2>
              <p class="muted">&nbsp;</p>
            </div>
          </article>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container footerInner">
        <p class="muted">&copy; <span id="year"></span> BLOOM.INFIVE. Todos los derechos reservados.</p>
      </div>
    </footer>
  </main>

  <script src="../nav.js"></script>

  <script type="module">
    import { db } from "../firebase.js";
    import { logPageView } from "../analytics.js";
    import {
      collection, query, where, orderBy, onSnapshot, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const postsEl = document.getElementById("posts");
    logPageView({ page: "blog_index" });

    function esc(s){
      return (s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function previewFromHtml(html, n=220){
      const d = document.createElement("div");
      d.innerHTML = html || "";
      const t = (d.textContent || "").trim();
      return t.length > n ? t.slice(0, n).trimEnd() + "..." : t;
    }

    function renderDocs(docs){
      if (!docs.length) {
        postsEl.innerHTML = `<div class="empty-state"><p class="muted">Aun no hay historias.</p></div>`;
        return;
      }

      postsEl.innerHTML = docs.map((docSnap, idx) => {
        const p = docSnap.data();
        const tags = Array.isArray(p.tags) ? p.tags : [];
        const preview = previewFromHtml(p.contentHtml || p.content || "");
        const num = String(idx + 1).padStart(2, "0");

        return `
          <article class="postCard">
            <div class="post-index">${num}</div>
            <div class="post-body">
              <h2>
                <a href="./post.html?id=${docSnap.id}">${esc(p.title || "Sin título")}</a>
              </h2>

              <p class="muted">${esc(preview)}</p>

              <div class="metaRow">
                ${tags.slice(0, 6).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
                <a class="btn small ghost" href="./post.html?id=${docSnap.id}">Leer historia &rarr;</a>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function showError(msg){
      postsEl.innerHTML = `
        <div class="empty-state">
          <h2 style="margin:0 0 10px;">Error al cargar historias</h2>
          <p class="muted" style="margin:0;">${esc(msg)}</p>
        </div>
      `;
    }

    // Real-time listener (updates immediately once the network returns)
    // Recompute "now" every 30s so scheduled posts appear without refresh.
    let unsubscribe = null;

    function startListener(){
      const now = Timestamp.now();

      const q = query(
        collection(db, "posts"),
        where("published", "==", true),
        where("publishAt", "<=", now),
        orderBy("publishAt", "desc")
      );

      if (unsubscribe) unsubscribe();

      unsubscribe = onSnapshot(q, (snap) => {
        renderDocs(snap.docs);
      }, (err) => {
        showError(err.message);
      });
    }

    startListener();
    setInterval(startListener, 30000);
  </script>
</body>
</html>
