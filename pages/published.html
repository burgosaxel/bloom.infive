<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Libros públicados | BLOOM.INFIVE</title>
  <meta name="description" content="Explora libros públicados y comentarios de lectoras en BLOOM.INFIVE." />
  <link rel="canonical" href="https://bloominfive.blog/pages/published.html" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BLOOM.INFIVE" />
  <meta property="og:title" content="Libros públicados | BLOOM.INFIVE" />
  <meta property="og:description" content="Libros públicados, comentarios y reacciones de lectoras." />
  <meta property="og:url" content="https://bloominfive.blog/pages/published.html" />
  <meta property="og:image" content="https://bloominfive.blog/angelika.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Libros públicados | BLOOM.INFIVE" />
  <meta name="twitter:description" content="Lee libros públicados y comentarios de la comunidad." />
  <meta name="twitter:image" content="https://bloominfive.blog/angelika.png" />
  <link rel="stylesheet" href="../styles.css" />
</head>

<body>
  <div id="navMount"></div>

  <main class="page-shell">
    <section class="page-hero">
      <div class="container page-hero-inner">
        <div>
          <p class="section-kicker">Librero</p>
          <h1 class="page-title">Libros Públicados</h1> 
          <p class="page-subtitle">Libros públicados, reacciones de lectoras y notas suaves de la comunidad Bloom.inFive.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="publishedCards" class="list showcase-list"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="container footerInner">
        <p class="muted">&copy; <span id="year"></span> BLOOM.INFIVE. Todos los derechos reservados.</p>
      </div>
    </footer>
  </main>

  <script src="../nav.js"></script>

  <script type="module">
    import {
      auth,
      db,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut
    } from "../firebase.js";
    import { logEvent, logPageView } from "../analytics.js";
    import {
      collection,
      doc,
      getDoc,
      getDocs,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      orderBy,
      limit,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    document.getElementById("year").textContent = new Date().getFullYear();
    logPageView({ page: "published_books" });

    const cardsEl = document.getElementById("publishedCards");
    const CLIENT_KEY = "bloomBookClientId";
    const REACTIONS = ["❤️", "👏", "😍", "😂", "🔥", "🙏"];
    let currentUser = null;
    let currentProfile = null; // { firstName, lastName, handle }
    const commentUiUpdaters = [];

    function safeLabelFromComment(c) {
      let n = (c?.display || c?.name || "Anonima").toString().trim();
      // Avoid leaking emails from early comments that used auth.email.
      if (n.includes("@")) n = "Miembro";
      return n || "Anonima";
    }

    async function signInForComments() {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        // Popup often fails on mobile/in-app browsers; redirect is more reliable.
        const code = (e && e.code) ? String(e.code) : "";
        if (code.includes("popup")) {
          await signInWithRedirect(auth, provider);
          return;
        }
        throw e;
      }
    }

    async function loadCommentProfile() {
      currentProfile = null;
      if (!currentUser) return;
      const ref = doc(db, "commentProfiles", currentUser.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) return;
      const d = snap.data() || {};
      const firstName = (d.firstName || "").toString().trim().slice(0, 40);
      const lastName = (d.lastName || "").toString().trim().slice(0, 60);
      const handle = (d.handle || "").toString().trim().slice(0, 40);
      if (!firstName || handle.length < 3) return;
      currentProfile = { firstName, lastName, handle };
    }

    async function saveCommentProfile({ firstName, lastName, handle }) {
      if (!currentUser) throw new Error("No has iniciado sesión");
      const f = (firstName || "").toString().trim().slice(0, 40);
      const l = (lastName || "").toString().trim().slice(0, 60);
      const h = (handle || "").toString().trim().slice(0, 40);
      if (!f) throw new Error("El nombre es requerido.");
      if (h.length < 3) throw new Error("El usuario debe tener al menos 3 caracteres.");
      if (!/^[a-zA-Z0-9_.]+$/.test(h)) throw new Error("El usuario solo puede usar letras, numeros, _ y .");

      const ref = doc(db, "commentProfiles", currentUser.uid);
      const now = serverTimestamp();
      await setDoc(ref, { firstName: f, lastName: l, handle: h, updatedAt: now, createdAt: now }, { merge: true });
      currentProfile = { firstName: f, lastName: l, handle: h };
    }

    function esc(s) {
      return (s || "")
        .toString()
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function getClientId() {
      let id = localStorage.getItem(CLIENT_KEY);
      if (id) return id;
      id = `anon_${Math.random().toString(36).slice(2)}_${Date.now()}`;
      localStorage.setItem(CLIENT_KEY, id);
      return id;
    }

    function normalizeReaction(v) {
      const x = (v || "").toString();
      return REACTIONS.includes(x) ? x : "";
    }

    async function getReactionState(bookId, clientId) {
      const reactionDoc = await getDoc(doc(db, "books", bookId, "likes", clientId));
      const selected = reactionDoc.exists() ? normalizeReaction((reactionDoc.data() || {}).reaction) : "";
      const snap = await getDocs(collection(db, "books", bookId, "likes"));
      const counts = Object.fromEntries(REACTIONS.map((r) => [r, 0]));

      snap.forEach((d) => {
        const raw = (d.data() || {}).reaction;
        // Legacy records had no reaction field; treat those as heart.
        const reaction = normalizeReaction(raw) || "❤️";
        if (counts[reaction] === undefined) return;
        counts[reaction] += 1;
      });

      return { selected, counts };
    }

    function totalReactions(counts) {
      return REACTIONS.reduce((sum, r) => sum + (counts[r] || 0), 0);
    }

    function reactionControlHtml(state) {
      const active = state.selected || "❤️";
      const total = totalReactions(state.counts);
      return `
        <div style="position:relative;display:inline-block;" data-reaction-wrap>
          <button class="btn small ${state.selected ? "primary" : "ghost"}" type="button" data-react-main>
            ${active} <span>${total}</span>
          </button>
          <div class="reaction-picker" data-reaction-picker style="display:none;position:absolute;left:0;bottom:calc(100% + 8px);background:var(--card);border:1px solid var(--control-border);border-radius:var(--radius-lg);padding:6px;box-shadow:var(--shadow-soft);white-space:nowrap;z-index:20;">
            ${REACTIONS.map((reaction, idx) => `<button class="btn small ghost" type="button" data-reaction="${idx}" style="min-width:0;padding:6px 8px;">${reaction}</button>`).join("")}
          </div>
        </div>
      `;
    }

    async function getComments(bookId) {
      const commentsQ = query(
        collection(db, "books", bookId, "comments"),
        orderBy("createdAt", "desc"),
        limit(50)
      );
      const snap = await getDocs(commentsQ);
      return snap.docs.map((d) => ({ id: d.id, ...(d.data() || {}) }));
    }

    function renderComments(commentsHost, comments, bookId) {
      if (!commentsHost) return;
      if (!comments.length) {
        commentsHost.innerHTML = `<p class="muted">Aun no hay comentarios.</p>`;
        return;
      }

      commentsHost.innerHTML = comments.map((c) => {
        const who = esc(safeLabelFromComment(c));
        const mine = !!(currentUser && c.uid && c.uid === currentUser.uid);
        const text = esc((c.text || "").toString());

        const actions = mine ? `
          <div class="row" style="gap:8px; margin-top:10px;">
            <button class="btn small ghost" type="button" data-edit-comment="${esc(c.id)}">Edit</button>
            <button class="btn small ghost" type="button" data-del-comment="${esc(c.id)}">Delete</button>
          </div>
        ` : "";

        return `
          <div class="listItem comment-card" style="padding:10px 12px;">
            <div style="width:100%;">
              <div class="comment-author" style="font-weight:700;">${who}</div>
              <div class="muted" data-comment-text="${esc(c.id)}">${text}</div>
              ${actions}
            </div>
          </div>
        `;
      }).join("");

      // Wire edit/delete buttons (event delegation per card)
      commentsHost.querySelectorAll("[data-del-comment]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-del-comment");
          if (!id) return;
          if (!confirm("Eliminar este comentario?")) return;
          try {
            await deleteDoc(doc(db, "books", bookId, "comments", id));
            const updated = await getComments(bookId);
            renderComments(commentsHost, updated, bookId);
          } catch (e) {
            console.error(e);
            alert("No se pudo eliminar el comentario. Inténtalo de nuevo.");
          }
        });
      });

      commentsHost.querySelectorAll("[data-edit-comment]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-edit-comment");
          if (!id) return;
          // Avoid CSS.escape dependency (some mobile browsers don't support it).
          const item = btn.closest(".listItem");
          const textEl = item ? item.querySelector("[data-comment-text]") : null;
          if (!textEl) return;

          const current = (textEl.textContent || "").toString();
          const wrap = document.createElement("div");
          wrap.innerHTML = `
            <textarea rows="3" maxlength="1000" style="width:100%; min-width:260px;">${esc(current)}</textarea>
            <div class="row" style="gap:8px; margin-top:10px;">
              <button class="btn small primary" type="button" data-save>Guardar</button>
              <button class="btn small ghost" type="button" data-cancel>Cancelar</button>
            </div>
          `;
          const ta = wrap.querySelector("textarea");
          const saveBtn = wrap.querySelector("[data-save]");
          const cancelBtn = wrap.querySelector("[data-cancel]");

          const originalHtml = textEl.parentElement.innerHTML;
          // Replace the whole comment body for this item
          textEl.parentElement.innerHTML = "";
          textEl.parentElement.appendChild(wrap);
          ta.focus();

          cancelBtn.addEventListener("click", () => {
            textEl.parentElement.innerHTML = originalHtml;
            // Re-render to reattach listeners cleanly
            getComments(bookId).then((updated) => renderComments(commentsHost, updated, bookId)).catch(() => {});
          });

          saveBtn.addEventListener("click", async () => {
            const next = (ta.value || "").toString().trim().slice(0, 1000);
            if (!next) {
              alert("El comentario no puede estar vacio.");
              return;
            }
            try {
              await updateDoc(doc(db, "books", bookId, "comments", id), { text: next, editedAt: serverTimestamp() });
              const updated = await getComments(bookId);
              renderComments(commentsHost, updated, bookId);
            } catch (e) {
              console.error(e);
              alert("No se pudo editar el comentario. Inténtalo de nuevo.");
            }
          });
        });
      });
    }

    async function renderCard(bookSnap) {
      const book = bookSnap.data() || {};
      const id = bookSnap.id;
      const clientId = getClientId();
      const comments = await getComments(id);

      const card = document.createElement("article");
      card.className = "card book-card";

      const cover = book.coverUrl
        ? `<div class="book-cover-rail"><img class="book-cover" src="${esc(book.coverUrl)}" alt="${esc(book.title || "Portada del libro")}" /></div>`
        : `<div class="book-cover-rail" aria-hidden="true"><span class="badge">Publicado</span></div>`;

      const linkBtn = book.link
        ? `<a class="btn small ghost" href="${esc(book.link)}" target="_blank" rel="noopener">Ver libro</a>`
        : "";

      card.innerHTML = `
        ${cover}
        <div class="book-body">
          <span class="badge">Libro públicado</span>
          <h2 style="margin:0 0 8px;">${esc(book.title || "Sin título")}</h2>
          <p class="muted book-summary" style="margin:0 0 12px;">${esc(book.summary || "")}</p>
          <div class="row book-actions" style="margin-bottom:8px;">
            ${linkBtn}
          </div>
          <div class="row reaction-row" data-reactions style="margin-bottom:12px; gap:8px; flex-wrap:wrap;"></div>
          <p class="muted fine" style="margin:0 0 12px;">Las reacciones son anónimas.</p>

          <div class="comments-panel" style="margin-top:8px;">
            <h3 style="margin:0 0 8px; font-size:16px;">Resenas / Comentarios</h3>
            <div data-comments class="list" style="margin-bottom:10px;"></div>

            <div data-comment-auth style="margin: 0 0 10px;"></div>

            <form data-comment-form class="form" style="align-items:stretch;">
              <textarea name="text" rows="3" placeholder="Escribe un comentario..." maxlength="1000" required style="min-width:260px;"></textarea>
              <button class="btn small primary" type="submit">Publicar comentario</button>
            </form>
            <p class="muted fine" data-comment-msg></p>
          </div>
        </div>
      `;

      const commentsHost = card.querySelector("[data-comments]");
      renderComments(commentsHost, comments, id);

      const reactionsHost = card.querySelector("[data-reactions]");

      async function renderReactions() {
        const state = await getReactionState(id, clientId);
        reactionsHost.innerHTML = reactionControlHtml(state);

        const wrap = reactionsHost.querySelector("[data-reaction-wrap]");
        const mainBtn = reactionsHost.querySelector("[data-react-main]");
        const picker = reactionsHost.querySelector("[data-reaction-picker]");
        if (!wrap || !mainBtn || !picker) return;

        let holdTimer = null;
        let holdTriggered = false;

        const closePicker = () => { picker.style.display = "none"; };
        const openPicker = () => { picker.style.display = "block"; };

        const applyReaction = async (nextReaction) => {
          const ref = doc(db, "books", id, "likes", clientId);
          const snap = await getDoc(ref);
          const cur = snap.exists() ? normalizeReaction((snap.data() || {}).reaction) : "";

          if (snap.exists() && cur === nextReaction) {
            await deleteDoc(ref);
            logEvent("book_unlike", { bookId: id });
          } else {
            await setDoc(ref, { reaction: nextReaction, updatedAt: serverTimestamp(), createdAt: serverTimestamp() }, { merge: true });
            logEvent("book_like", { bookId: id });
          }
          await renderReactions();
        };

        mainBtn.addEventListener("pointerdown", () => {
          holdTriggered = false;
          holdTimer = setTimeout(() => {
            holdTriggered = true;
            openPicker();
          }, 450);
        });

        mainBtn.addEventListener("pointerup", async () => {
          if (holdTimer) clearTimeout(holdTimer);
          if (holdTriggered) return;
          await applyReaction("❤️");
        });

        mainBtn.addEventListener("pointerleave", () => {
          if (holdTimer) clearTimeout(holdTimer);
        });

        picker.querySelectorAll("[data-reaction]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const idx = Number(btn.getAttribute("data-reaction"));
            const nextReaction = REACTIONS[idx];
            if (!nextReaction) return;
            closePicker();
            await applyReaction(nextReaction);
          });
        });

        document.addEventListener("click", (e) => {
          if (!wrap.contains(e.target)) closePicker();
        }, { once: true });
      }

      await renderReactions();

      const commentForm = card.querySelector("[data-comment-form]");
      const commentMsg = card.querySelector("[data-comment-msg]");
      const commentAuth = card.querySelector("[data-comment-auth]");

      function updateCommentUi() {
        if (!commentAuth || !commentForm) return;
        if (!currentUser) {
          commentAuth.innerHTML = `
            <button class="btn small ghost" type="button" data-signin-btn>
              Inicia sesión con Google para comentar
            </button>
            <br/>
            <span class="muted fine">Las reacciones son anónimas.</span>
          `;
          commentForm.style.display = "none";
          const btn = commentAuth.querySelector("[data-signin-btn]");
          if (btn) {
            btn.addEventListener("click", async () => {
              commentMsg.textContent = "";
              try {
                await signInForComments();
              } catch (e) {
                console.error(e);
              commentMsg.textContent = "No se pudo iniciar sesión. Inténtalo de nuevo.";
              }
            });
          }
          return;
        }

        if (!currentProfile) {
          commentAuth.innerHTML = `
            <div class="card profile-card" style="padding:12px; border-radius:var(--radius-md); margin-bottom:10px;">
              <div style="font-weight:800; margin-bottom:8px;">Configura tu perfil de comentarios</div>
              <div class="muted fine" style="margin-bottom:10px;">
                Esto mantiene tu correo privado. Elige un usuario público que aparecerá con tus comentarios.
              </div>
              <form data-profile-form class="form" style="align-items:stretch;">
                <input name="firstName" placeholder="Nombre" maxlength="40" required style="min-width:160px;" />
                <input name="lastName" placeholder="Apellido" maxlength="60" style="min-width:160px;" />
                <input name="handle" placeholder="Usuario público" maxlength="40" required style="min-width:180px;" />
                <button class="btn small primary" type="submit">Guardar</button>
              </form>
              <div class="muted fine" data-profile-msg style="margin-top:8px;"></div>
              <button class="btn small" type="button" data-signout-btn style="margin-top:10px;">Cerrar sesión</button>
            </div>
          `;
          commentForm.style.display = "none";

          const signoutBtn = commentAuth.querySelector("[data-signout-btn]");
          if (signoutBtn) {
            signoutBtn.addEventListener("click", async () => {
              try { await signOut(auth); } catch (e) { console.error(e); }
            });
          }

          const form = commentAuth.querySelector("[data-profile-form]");
          const out = commentAuth.querySelector("[data-profile-msg]");
          if (form) {
            form.addEventListener("submit", async (e) => {
              e.preventDefault();
              out.textContent = "";
              const fd = new FormData(form);
              try {
                await saveCommentProfile({
                  firstName: fd.get("firstName"),
                  lastName: fd.get("lastName"),
                  handle: fd.get("handle"),
                });
                out.textContent = "Guardado. Ya puedes comentar.";
                commentUiUpdaters.forEach((fn) => {
                  try { fn(); } catch (err) { console.error(err); }
                });
              } catch (err) {
                console.error(err);
                out.textContent = err?.message || "No se pudo guardar el perfil.";
              }
            });
          }
          return;
        }

        commentAuth.innerHTML = `
          <span class="muted fine">Comentando como <strong>${esc(currentProfile.handle)}</strong></span>
          <button class="btn small" type="button" data-signout-btn style="margin-left:10px;">Cerrar sesión</button>
        `;
        commentForm.style.display = "";
        const signoutBtn = commentAuth.querySelector("[data-signout-btn]");
        if (signoutBtn) {
          signoutBtn.addEventListener("click", async () => {
            try { await signOut(auth); } catch (e) { console.error(e); }
          });
        }
      }

      commentUiUpdaters.push(updateCommentUi);
      updateCommentUi();

      commentForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!currentUser) {
          commentMsg.textContent = "Por favor inicia sesión para comentar.";
          return;
        }
        if (!currentProfile) {
          commentMsg.textContent = "Primero configura tu perfil de comentarios.";
          return;
        }

        const fd = new FormData(commentForm);
        const text = (fd.get("text") || "").toString().trim().slice(0, 1000);

        if (!text) {
          commentMsg.textContent = "El comentario no puede estar vacio.";
          return;
        }

        await addDoc(collection(db, "books", id, "comments"), {
          uid: currentUser.uid,
          display: currentProfile.handle,
          text,
          createdAt: serverTimestamp(),
        });
        logEvent("book_comment", { bookId: id });

        commentMsg.textContent = "Comentario públicado.";
        commentForm.reset();

        const updatedComments = await getComments(id);
        renderComments(commentsHost, updatedComments, id);
      });

      return card;
    }

    async function loadPublishedBooks() {
      cardsEl.innerHTML = `<div class="loading-state"><p class="muted">Cargando...</p></div>`;

      const q = query(
        collection(db, "books"),
        where("status", "==", "published")
      );

      const snap = await getDocs(q);
      if (snap.empty) {
        cardsEl.innerHTML = `<div class="empty-state"><p class="muted">Aun no hay libros públicados.</p></div>`;
        return;
      }

      cardsEl.innerHTML = "";
      const docs = [...snap.docs].sort((a, b) => {
        const at = a.data()?.createdAt?.toMillis ? a.data().createdAt.toMillis() : 0;
        const bt = b.data()?.createdAt?.toMillis ? b.data().createdAt.toMillis() : 0;
        return bt - at;
      });
      for (const bookSnap of docs) {
        const card = await renderCard(bookSnap);
        cardsEl.appendChild(card);
      }
    }

    loadPublishedBooks().catch((err) => {
      console.error(err);
      cardsEl.innerHTML = `<div class="empty-state"><p class="muted">No se pudieron cargar los libros públicados ahora mismo.</p></div>`;
    });

    // Auth state: comments require sign-in, likes stay anonymous.
    getRedirectResult(auth).catch(() => {});
    onAuthStateChanged(auth, async (user) => {
      currentUser = user || null;
      try {
        await loadCommentProfile();
      } catch (e) {
        console.error(e);
        currentProfile = null;
      }
      commentUiUpdaters.forEach((fn) => {
        try { fn(); } catch (e) { console.error(e); }
      });
    });
  </script>
</body>
</html>
