<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Published Books | BLOOM.INFIVE</title>
  <link rel="stylesheet" href="../styles.css" />
</head>

<body>
  <div id="navMount"></div>

  <main>
    <section class="section">
      <div class="container">
        <div class="sectionHead">
          <h2>Published Books</h2>
          <p class="muted"></p>
        </div>

        <div id="publishedCards" class="list"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="container footerInner">
        <p class="muted">&copy; <span id="year"></span> BLOOM.INFIVE. All rights reserved.</p>
      </div>
    </footer>
  </main>

  <script src="../nav.js"></script>

  <script type="module">
    import {
      auth,
      db,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut
    } from "../firebase.js";
    import {
      collection,
      doc,
      getDoc,
      getDocs,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      orderBy,
      limit,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    document.getElementById("year").textContent = new Date().getFullYear();

    const cardsEl = document.getElementById("publishedCards");
    const CLIENT_KEY = "bloomBookClientId";
    let currentUser = null;
    let currentProfile = null; // { firstName, lastName, handle }
    const commentUiUpdaters = [];

    function safeLabelFromComment(c) {
      let n = (c?.display || c?.name || "Anonymous").toString().trim();
      // Avoid leaking emails from early comments that used auth.email.
      if (n.includes("@")) n = "Member";
      return n || "Anonymous";
    }

    async function signInForComments() {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        // Popup often fails on mobile/in-app browsers; redirect is more reliable.
        const code = (e && e.code) ? String(e.code) : "";
        if (code.includes("popup")) {
          await signInWithRedirect(auth, provider);
          return;
        }
        throw e;
      }
    }

    async function loadCommentProfile() {
      currentProfile = null;
      if (!currentUser) return;
      const ref = doc(db, "commentProfiles", currentUser.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) return;
      const d = snap.data() || {};
      const firstName = (d.firstName || "").toString().trim().slice(0, 40);
      const lastName = (d.lastName || "").toString().trim().slice(0, 60);
      const handle = (d.handle || "").toString().trim().slice(0, 40);
      if (!firstName || handle.length < 3) return;
      currentProfile = { firstName, lastName, handle };
    }

    async function saveCommentProfile({ firstName, lastName, handle }) {
      if (!currentUser) throw new Error("Not signed in");
      const f = (firstName || "").toString().trim().slice(0, 40);
      const l = (lastName || "").toString().trim().slice(0, 60);
      const h = (handle || "").toString().trim().slice(0, 40);
      if (!f) throw new Error("First name is required.");
      if (h.length < 3) throw new Error("User ID must be at least 3 characters.");
      if (!/^[a-zA-Z0-9_.]+$/.test(h)) throw new Error("User ID can only use letters, numbers, _ and .");

      const ref = doc(db, "commentProfiles", currentUser.uid);
      const now = serverTimestamp();
      await setDoc(ref, { firstName: f, lastName: l, handle: h, updatedAt: now, createdAt: now }, { merge: true });
      currentProfile = { firstName: f, lastName: l, handle: h };
    }

    function esc(s) {
      return (s || "")
        .toString()
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function getClientId() {
      let id = localStorage.getItem(CLIENT_KEY);
      if (id) return id;
      id = `anon_${Math.random().toString(36).slice(2)}_${Date.now()}`;
      localStorage.setItem(CLIENT_KEY, id);
      return id;
    }

    async function getLikeState(bookId, clientId) {
      const likeDoc = await getDoc(doc(db, "books", bookId, "likes", clientId));
      const likeSnap = await getDocs(collection(db, "books", bookId, "likes"));
      return { liked: likeDoc.exists(), count: likeSnap.size };
    }

    async function getComments(bookId) {
      const commentsQ = query(
        collection(db, "books", bookId, "comments"),
        orderBy("createdAt", "desc"),
        limit(50)
      );
      const snap = await getDocs(commentsQ);
      return snap.docs.map((d) => ({ id: d.id, ...(d.data() || {}) }));
    }

    function renderComments(commentsHost, comments, bookId) {
      if (!commentsHost) return;
      if (!comments.length) {
        commentsHost.innerHTML = `<p class="muted">No comments yet.</p>`;
        return;
      }

      commentsHost.innerHTML = comments.map((c) => {
        const who = esc(safeLabelFromComment(c));
        const mine = !!(currentUser && c.uid && c.uid === currentUser.uid);
        const text = esc((c.text || "").toString());

        const actions = mine ? `
          <div class="row" style="gap:8px; margin-top:10px;">
            <button class="btn small ghost" type="button" data-edit-comment="${esc(c.id)}">Edit</button>
            <button class="btn small ghost" type="button" data-del-comment="${esc(c.id)}">Delete</button>
          </div>
        ` : "";

        return `
          <div class="listItem" style="padding:10px 12px;">
            <div style="width:100%;">
              <div style="font-weight:700;">${who}</div>
              <div class="muted" data-comment-text="${esc(c.id)}">${text}</div>
              ${actions}
            </div>
          </div>
        `;
      }).join("");

      // Wire edit/delete buttons (event delegation per card)
      commentsHost.querySelectorAll("[data-del-comment]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-del-comment");
          if (!id) return;
          if (!confirm("Delete this comment?")) return;
          try {
            await deleteDoc(doc(db, "books", bookId, "comments", id));
            const updated = await getComments(bookId);
            renderComments(commentsHost, updated, bookId);
          } catch (e) {
            console.error(e);
            alert("Unable to delete comment. Please try again.");
          }
        });
      });

      commentsHost.querySelectorAll("[data-edit-comment]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-edit-comment");
          if (!id) return;
          const textEl = commentsHost.querySelector(`[data-comment-text="${CSS.escape(id)}"]`);
          if (!textEl) return;

          const current = (textEl.textContent || "").toString();
          const wrap = document.createElement("div");
          wrap.innerHTML = `
            <textarea rows="3" maxlength="1000" style="width:100%; min-width:260px;">${esc(current)}</textarea>
            <div class="row" style="gap:8px; margin-top:10px;">
              <button class="btn small primary" type="button" data-save>Edit</button>
              <button class="btn small ghost" type="button" data-cancel>Cancel</button>
            </div>
          `;
          const ta = wrap.querySelector("textarea");
          const saveBtn = wrap.querySelector("[data-save]");
          const cancelBtn = wrap.querySelector("[data-cancel]");

          const originalHtml = textEl.parentElement.innerHTML;
          // Replace the whole comment body for this item
          textEl.parentElement.innerHTML = "";
          textEl.parentElement.appendChild(wrap);
          ta.focus();

          cancelBtn.addEventListener("click", () => {
            textEl.parentElement.innerHTML = originalHtml;
            // Re-render to reattach listeners cleanly
            getComments(bookId).then((updated) => renderComments(commentsHost, updated, bookId)).catch(() => {});
          });

          saveBtn.addEventListener("click", async () => {
            const next = (ta.value || "").toString().trim().slice(0, 1000);
            if (!next) {
              alert("Comment cannot be empty.");
              return;
            }
            try {
              await updateDoc(doc(db, "books", bookId, "comments", id), { text: next, editedAt: serverTimestamp() });
              const updated = await getComments(bookId);
              renderComments(commentsHost, updated, bookId);
            } catch (e) {
              console.error(e);
              alert("Unable to edit comment. Please try again.");
            }
          });
        });
      });
    }

    async function renderCard(bookSnap) {
      const book = bookSnap.data() || {};
      const id = bookSnap.id;
      const clientId = getClientId();
      const { liked, count } = await getLikeState(id, clientId);
      const comments = await getComments(id);

      const card = document.createElement("article");
      card.className = "card";

      const cover = book.coverUrl
        ? `<img src="${esc(book.coverUrl)}" alt="${esc(book.title || "Book cover")}" style="width:100%;max-width:220px;border-radius:12px;border:1px solid var(--control-border);margin-bottom:12px;" />`
        : "";

      const linkBtn = book.link
        ? `<a class="btn small ghost" href="${esc(book.link)}" target="_blank" rel="noopener">Book Link</a>`
        : "";

      card.innerHTML = `
        ${cover}
        <h2 style="margin:0 0 8px;">${esc(book.title || "Untitled")}</h2>
        <p class="muted" style="margin:0 0 12px;">${esc(book.summary || "")}</p>
        <div class="row" style="margin-bottom:12px;">
          ${linkBtn}
          <button class="btn small" data-like-btn>
            ${liked ? "&#10084;" : "&#9825;"} <span data-like-count>${count}</span>
          </button>
        </div>

        <div style="margin-top:8px;">
          <h3 style="margin:0 0 8px; font-size:16px;">Reviews / Comments</h3>
          <div data-comments class="list" style="margin-bottom:10px;"></div>

          <div data-comment-auth style="margin: 0 0 10px;"></div>

          <form data-comment-form class="form" style="align-items:stretch;">
            <textarea name="text" rows="3" placeholder="Write a comment..." maxlength="1000" required style="min-width:260px;"></textarea>
            <button class="btn small primary" type="submit">Post Comment</button>
          </form>
          <p class="muted fine" data-comment-msg></p>
        </div>
      `;

      const commentsHost = card.querySelector("[data-comments]");
      renderComments(commentsHost, comments, id);

      const likeBtn = card.querySelector("[data-like-btn]");
      const likeCount = card.querySelector("[data-like-count]");
      likeBtn.addEventListener("click", async () => {
        const likeRef = doc(db, "books", id, "likes", clientId);
        const current = await getDoc(likeRef);
        if (current.exists()) {
          await deleteDoc(likeRef);
        } else {
          await setDoc(likeRef, { createdAt: serverTimestamp() });
        }
        const state = await getLikeState(id, clientId);
        likeBtn.innerHTML = `${state.liked ? "&#10084;" : "&#9825;"} <span data-like-count>${state.count}</span>`;
        likeCount.textContent = String(state.count);
      });

      const commentForm = card.querySelector("[data-comment-form]");
      const commentMsg = card.querySelector("[data-comment-msg]");
      const commentAuth = card.querySelector("[data-comment-auth]");

      function updateCommentUi() {
        if (!commentAuth || !commentForm) return;
        if (!currentUser) {
          commentAuth.innerHTML = `
            <button class="btn small ghost" type="button" data-signin-btn>
              Sign in with Google to comment
            </button>
            <span class="muted fine" style="margin-left:8px;">Likes are anonymous.</span>
          `;
          commentForm.style.display = "none";
          const btn = commentAuth.querySelector("[data-signin-btn]");
          if (btn) {
            btn.addEventListener("click", async () => {
              commentMsg.textContent = "";
              try {
                await signInForComments();
              } catch (e) {
                console.error(e);
                commentMsg.textContent = "Sign-in failed. Please try again.";
              }
            });
          }
          return;
        }

        if (!currentProfile) {
          commentAuth.innerHTML = `
            <div class="card" style="padding:12px; border-radius:14px; margin-bottom:10px;">
              <div style="font-weight:800; margin-bottom:8px;">Set up your comment profile</div>
              <div class="muted fine" style="margin-bottom:10px;">
                This keeps your email private. Choose a public User ID that will show with your comments.
              </div>
              <form data-profile-form class="form" style="align-items:stretch;">
                <input name="firstName" placeholder="First name" maxlength="40" required style="min-width:160px;" />
                <input name="lastName" placeholder="Last name" maxlength="60" style="min-width:160px;" />
                <input name="handle" placeholder="User ID (public)" maxlength="40" required style="min-width:180px;" />
                <button class="btn small primary" type="submit">Save</button>
              </form>
              <div class="muted fine" data-profile-msg style="margin-top:8px;"></div>
              <button class="btn small" type="button" data-signout-btn style="margin-top:10px;">Sign out</button>
            </div>
          `;
          commentForm.style.display = "none";

          const signoutBtn = commentAuth.querySelector("[data-signout-btn]");
          if (signoutBtn) {
            signoutBtn.addEventListener("click", async () => {
              try { await signOut(auth); } catch (e) { console.error(e); }
            });
          }

          const form = commentAuth.querySelector("[data-profile-form]");
          const out = commentAuth.querySelector("[data-profile-msg]");
          if (form) {
            form.addEventListener("submit", async (e) => {
              e.preventDefault();
              out.textContent = "";
              const fd = new FormData(form);
              try {
                await saveCommentProfile({
                  firstName: fd.get("firstName"),
                  lastName: fd.get("lastName"),
                  handle: fd.get("handle"),
                });
                out.textContent = "Saved. You can comment now.";
                commentUiUpdaters.forEach((fn) => {
                  try { fn(); } catch (err) { console.error(err); }
                });
              } catch (err) {
                console.error(err);
                out.textContent = err?.message || "Unable to save profile.";
              }
            });
          }
          return;
        }

        commentAuth.innerHTML = `
          <span class="muted fine">Commenting as <strong>${esc(currentProfile.handle)}</strong></span>
          <button class="btn small" type="button" data-signout-btn style="margin-left:10px;">Sign out</button>
        `;
        commentForm.style.display = "";
        const signoutBtn = commentAuth.querySelector("[data-signout-btn]");
        if (signoutBtn) {
          signoutBtn.addEventListener("click", async () => {
            try { await signOut(auth); } catch (e) { console.error(e); }
          });
        }
      }

      commentUiUpdaters.push(updateCommentUi);
      updateCommentUi();

      commentForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!currentUser) {
          commentMsg.textContent = "Please sign in to comment.";
          return;
        }
        if (!currentProfile) {
          commentMsg.textContent = "Please set up your comment profile first.";
          return;
        }

        const fd = new FormData(commentForm);
        const text = (fd.get("text") || "").toString().trim().slice(0, 1000);

        if (!text) {
          commentMsg.textContent = "Comment cannot be empty.";
          return;
        }

        await addDoc(collection(db, "books", id, "comments"), {
          uid: currentUser.uid,
          display: currentProfile.handle,
          text,
          createdAt: serverTimestamp(),
        });

        commentMsg.textContent = "Comment posted.";
        commentForm.reset();

        const updatedComments = await getComments(id);
        renderComments(commentsHost, updatedComments, id);
      });

      return card;
    }

    async function loadPublishedBooks() {
      cardsEl.innerHTML = `<div class="card"><p class="muted">Loading...</p></div>`;

      const q = query(
        collection(db, "books"),
        where("status", "==", "published")
      );

      const snap = await getDocs(q);
      if (snap.empty) {
        cardsEl.innerHTML = `<div class="card"><p class="muted">No published books yet.</p></div>`;
        return;
      }

      cardsEl.innerHTML = "";
      const docs = [...snap.docs].sort((a, b) => {
        const at = a.data()?.createdAt?.toMillis ? a.data().createdAt.toMillis() : 0;
        const bt = b.data()?.createdAt?.toMillis ? b.data().createdAt.toMillis() : 0;
        return bt - at;
      });
      for (const bookSnap of docs) {
        const card = await renderCard(bookSnap);
        cardsEl.appendChild(card);
      }
    }

    loadPublishedBooks().catch((err) => {
      console.error(err);
      cardsEl.innerHTML = `<div class="card"><p class="muted">Unable to load published books right now.</p></div>`;
    });

    // Auth state: comments require sign-in, likes stay anonymous.
    getRedirectResult(auth).catch(() => {});
    onAuthStateChanged(auth, async (user) => {
      currentUser = user || null;
      try {
        await loadCommentProfile();
      } catch (e) {
        console.error(e);
        currentProfile = null;
      }
      commentUiUpdaters.forEach((fn) => {
        try { fn(); } catch (e) { console.error(e); }
      });
    });
  </script>
</body>
</html>
