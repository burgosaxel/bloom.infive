<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proximamente | BLOOM.INFIVE</title>
  <meta name="description" content="Mira los libros y proyectos que vienen de BLOOM.INFIVE." />
  <link rel="canonical" href="https://bloominfive.blog/pages/upcoming.html" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BLOOM.INFIVE" />
  <meta property="og:title" content="Proximamente | BLOOM.INFIVE" />
  <meta property="og:description" content="Libros en camino de BLOOM.INFIVE." />
  <meta property="og:url" content="https://bloominfive.blog/pages/upcoming.html" />
  <meta property="og:image" content="https://bloominfive.blog/angelika.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Proximamente | BLOOM.INFIVE" />
  <meta name="twitter:description" content="Mira que libros vienen pronto." />
  <meta name="twitter:image" content="https://bloominfive.blog/angelika.png" />
  <link rel="stylesheet" href="../styles.css" />
</head>

<body>
  <div id="navMount"></div>

  <main class="page-shell">
    <section class="page-hero">
      <div class="container page-hero-inner">
        <div>
          <p class="section-kicker">Muy pronto</p>
          <h1 class="page-title">Proyectos en Construcción</h1>
          <p class="page-subtitle">Un vistazo tranquilo a libros y proyectos que todavía están tomando forma.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="upcomingCards" class="list showcase-list"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="container footerInner">
        <p class="muted">&copy; <span id="year"></span> BLOOM.INFIVE. Todos los derechos reservados.</p>
      </div>
    </footer>
  </main>

  <script src="../nav.js"></script>

  <script type="module">
    import { db } from "../firebase.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    document.getElementById("year").textContent = new Date().getFullYear();

    const cardsEl = document.getElementById("upcomingCards");

    function esc(s) {
      return (s || "")
        .toString()
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    async function loadUpcoming() {
      cardsEl.innerHTML = `<div class="loading-state"><p class="muted">Cargando...</p></div>`;

      const q = query(
        collection(db, "books"),
        where("status", "==", "upcoming")
      );

      const snap = await getDocs(q);
      if (snap.empty) {
        cardsEl.innerHTML = `<div class="empty-state"><p class="muted">Aun no hay libros próximos. Este espacio crecera cuando la siguiente historia este lista.</p></div>`;
        return;
      }

      const docs = [...snap.docs].sort((a, b) => {
        const at = a.data()?.createdAt?.toMillis ? a.data().createdAt.toMillis() : 0;
        const bt = b.data()?.createdAt?.toMillis ? b.data().createdAt.toMillis() : 0;
        return bt - at;
      });

      cardsEl.innerHTML = docs.map((docSnap) => {
        const b = docSnap.data() || {};
        const cover = b.coverUrl
          ? `<div class="book-cover-rail"><img class="book-cover" src="${esc(b.coverUrl)}" alt="${esc(b.title || "Book cover")}" /></div>`
          : `<div class="book-cover-rail" aria-hidden="true"><span class="badge">Muy pronto</span></div>`;

        return `
          <article class="card book-card">
            ${cover}
            <div class="book-body">
              <span class="badge">Proximamente</span>
              <h2 style="margin-top:12px;">${esc(b.title || "Sin título")}</h2>
              <p class="muted book-summary">${esc(b.summary || "")}</p>
              ${b.link ? `<a class="btn small ghost" href="${esc(b.link)}" target="_blank" rel="noopener">Ver libro</a>` : ""}
            </div>
          </article>
        `;
      }).join("");
    }

    loadUpcoming().catch((err) => {
      console.error(err);
      cardsEl.innerHTML = `<div class="empty-state"><p class="muted">No se pudieron cargar los próximos libros ahora mismo.</p></div>`;
    });
  </script>
</body>
</html>
