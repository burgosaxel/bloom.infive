<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favoritos | BLOOM.INFIVE</title>
  <meta name="description" content="Recomendaciones de Amazon y enlaces afiliados curados por BLOOM.INFIVE." />
  <link rel="canonical" href="https://bloominfive.blog/pages/affiliate.html" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BLOOM.INFIVE" />
  <meta property="og:title" content="Favoritos | BLOOM.INFIVE" />
  <meta property="og:description" content="Recomendaciones curadas y enlaces afiliados." />
  <meta property="og:url" content="https://bloominfive.blog/pages/affiliate.html" />
  <meta property="og:image" content="https://bloominfive.blog/angelika.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Favoritos | BLOOM.INFIVE" />
  <meta name="twitter:description" content="Explora recomendaciones curadas por BLOOM.INFIVE." />
  <meta name="twitter:image" content="https://bloominfive.blog/angelika.png" />
  <link rel="stylesheet" href="../styles.css" />
</head>

<body>
  <div id="navMount"></div>

  <main class="page-shell">
    <section class="page-hero">
      <div class="container page-hero-inner">
        <div>
          <p class="section-kicker">Favoritos probados por mamá</p>
          <h1 class="page-title">Favoritos para días familiares más suaves.</h1>
          <p class="page-subtitle">Hallazgos curados para maternidad, fe, ritmos del hogar y pequeñas cosas que hacen más ligeros los días reales.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="links" class="recommendation-list" style="display:grid; grid-template-columns:1fr; gap:14px;"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="container footerInner">
        <p class="muted">&copy; <span id="year"></span> BLOOM.INFIVE. Todos los derechos reservados.</p>
        <div class="footerLinks">
          <a href="../index.html">Inicio</a>
          <a href="../blog/index.html">Historias</a>
          <a href="../pages/newsletter.html">Cartas</a>
        </div>
      </div>
    </footer>
  </main>

  <script src="../nav.js"></script>

  <script type="module">
    import { db } from "../firebase.js";
    import { collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const linksEl = document.getElementById("links");

    function esc(s){
      return (s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    const q = query(collection(db, "affiliateLinks"), orderBy("updatedAt", "desc"));
    const snap = await getDocs(q);

    if (snap.empty) {
      linksEl.innerHTML = `<div class="empty-state"><p class="muted">Aun no hay enlaces.</p></div>`;
    } else {
      linksEl.innerHTML = snap.docs.map(d => {
        const x = d.data();
        return `
          <article class="card affiliate-card recommendation-card">
            <div>
              <div class="recommendation-meta">
                ${x.category ? `<span class="tag">${esc(x.category)}</span>` : `<span class="tag">Favorito de mamá</span>`}
              </div>
              <h2>${esc(x.title || "Enlace")}</h2>
              <p class="muted">${esc(x.description || x.desc || "")}</p>
            </div>
            <a class="btn small primary" href="${esc(x.url)}" target="_blank" rel="noopener">Ver favorito</a>
          </article>
        `;
      }).join("");
    }
  </script>
</body>
</html>
